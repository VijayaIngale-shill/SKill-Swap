<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages – GyanSwap</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --accent: #00FF9C;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.14);
      --text: #fff;
      --text-muted: rgba(255, 255, 255, 0.55);
      --sidebar-w: 240px;
      --chat-sidebar-w: 300px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: var(--text);
      display: flex;
      overflow: hidden;
    }

    /* ── Main Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 28px 0;
      height: 100vh;
      flex-shrink: 0;
    }
    .sidebar-logo {
      padding: 0 24px 28px;
      font-size: 20px; font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }
    .sidebar-logo span { color: var(--accent-soft); }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 24px;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none; font-size: 14px; font-weight: 500;
      transition: 0.2s;
    }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,0.07); }
    .nav-item.active {
      color: #fff; background: rgba(255, 255, 255, 0.12);
      font-weight: 600;
      position: relative;
    }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent);
    }
    .nav-badge {
      margin-left: auto; background: var(--accent);
      color: #222; font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 30px;
    }

    /* ── Chat Layout ── */
    .chat-container {
      display: flex;
      flex: 1;
      height: 100vh;
    }

    /* Chat Sidebar (Contacts List) */
    .chat-sidebar {
      width: var(--chat-sidebar-w);
      background: rgba(255, 255, 255, 0.03);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
    }
    .chat-sidebar-header {
      padding: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .chat-sidebar-header h2 { font-size: 18px; font-weight: 700; }

    .contacts-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 4px;
    }
    .contact-item:hover { background: rgba(255, 255, 255, 0.05); }
    .contact-item.active { background: rgba(255, 255, 255, 0.1); }

    .contact-av {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; overflow: hidden;
      flex-shrink: 0;
    }
    .contact-av img { width: 100%; height: 100%; object-fit: cover; }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-last-msg { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    /* Main Chat Window */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.05);
      position: relative;
    }

    .chat-header {
      padding: 18px 24px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header h3 { font-size: 16px; font-weight: 600; }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-wrapper {
        display: flex;
        flex-direction: column;
        max-width: 70%;
    }
    .msg-wrapper.sent { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.received { align-self: flex-start; align-items: flex-start; }

    .message {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      position: relative;
    }
    .sent .message {
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .received .message {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-bottom-left-radius: 4px;
    }
    .msg-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .chat-input-area {
      padding: 20px 24px;
      background: rgba(255, 255, 255, 0.03);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 12px;
    }
    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 12px 20px;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: 0.2s;
    }
    .chat-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.12); }

    .send-btn {
      background: var(--accent);
      color: #1a1a2e;
      border: none;
      width: 48px; height: 48px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px; transition: transform 0.2s;
    }
    .send-btn:hover { transform: scale(1.05); }

    .no-chat-selected {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      opacity: 0.5;
    }
    .no-chat-icon { font-size: 60px; margin-bottom: 20px; }

    /* Hide scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>

  <!-- Main Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">Gyan<span>Swap</span></div>
    <a href="Dashboard.html" class="nav-item">🏠 Dashboard</a>
    <a href="profile.html" class="nav-item">👤 My Profile</a>
    <a href="search.html" class="nav-item">🔍 Explore Skills</a>
    <a href="requests.html" class="nav-item">🤝 Requests <span class="nav-badge" id="requestsBadge" style="display:none;">0</span></a>
    <a href="messages.html" class="nav-item active">💬 Messages</a>
    <a href="sessions.html" class="nav-item">📅 Sessions <span class="nav-badge" id="sessionsBadge" style="display:none;">0</span></a>
  </aside>

  <div class="chat-container">
    <!-- Chat Contacts Sidebar -->
    <div class="chat-sidebar">
      <div class="chat-sidebar-header">
        <h2>Messages</h2>
      </div>
      <div class="contacts-list" id="contactsList">
        <!-- Live contacts loaded from accepted swap_requests -->
        <div style="padding: 20px; text-align: center; opacity: 0.5; font-size: 13px;">Loading connections...</div>
      </div>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-main" id="chatWindow">
      <div class="no-chat-selected">
        <div class="no-chat-icon">💬</div>
        <p>Select a connection to start chatting</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { 
      getFirestore, collection, query, where, onSnapshot, doc, getDoc, 
      setDoc, addDoc, serverTimestamp, orderBy, or, limit
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBq-BrrT0N4lszLMHowVkk12jit96t7sis",
      authDomain: "gyan-swap.firebaseapp.com",
      projectId: "gyan-swap",
      storageBucket: "gyan-swap.firebasestorage.app",
      messagingSenderId: "111231263033",
      appId: "1:111231263033:web:05d8e6166a06c57d57c8e8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = null;
    let currentChatId = null;
    let messageListener = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = 'registration.html'; return; }
      currentUserId = user.uid;
      loadConnections();
      listenForGlobalBadge();
      listenForSessions(user.uid);
      
      // Check for 'to' parameter in URL to auto-open a chat
      const urlParams = new URLSearchParams(window.location.search);
      const targetUid = urlParams.get('to');
      if (targetUid) {
          // This will be handled after connections load
      }
    });

    function listenForGlobalBadge() {
      const q = query(collection(db, "swap_requests"), where("toUid", "==", currentUserId), where("status", "==", "pending"));
      onSnapshot(q, (snapshot) => {
        const badge = document.getElementById('requestsBadge');
        if (badge) {
          badge.textContent = snapshot.size;
          badge.style.display = snapshot.empty ? 'none' : 'inline-block';
        }
      });
    }

    function listenForSessions(uid) {
      const q = query(collection(db, "sessions"), where("participants", "array-contains", uid));
      onSnapshot(q, (snapshot) => {
        const badge = document.getElementById('sessionsBadge');
        if (badge) {
          const incomingPending = snapshot.docs.filter(d => d.data().status === 'pending' && d.data().createdBy !== uid).length;
          badge.textContent = incomingPending;
          badge.style.display = incomingPending > 0 ? 'inline-block' : 'none';
        }
      });
    }

    async function loadConnections() {
      // Find all accepted swap_requests involving the current user
      const q = query(collection(db, "swap_requests"), where("status", "==", "accepted"));
      onSnapshot(q, async (snapshot) => {
        const contactsList = document.getElementById('contactsList');
        const connections = [];

        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.fromUid === currentUserId) {
            connections.push({ uid: data.toUid, name: data.toName || 'User', photo: null }); // Name might be updated below
          } else if (data.toUid === currentUserId) {
            connections.push({ uid: data.fromUid, name: data.fromName, photo: data.fromPhoto });
          }
        });

        if (connections.length === 0) {
          contactsList.innerHTML = '<div style="padding: 20px; text-align: center; opacity: 0.5; font-size: 13px;">No connections yet. Connect with someone to chat!</div>';
          return;
        }

        // Render contacts
        contactsList.innerHTML = '';
        connections.forEach(conn => {
          const item = document.createElement('div');
          item.className = 'contact-item';
          item.id = `contact-${conn.uid}`;
          const init = conn.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
          
          item.innerHTML = `
            <div class="contact-av">${conn.photo ? `<img src="${conn.photo}">` : init}</div>
            <div class="contact-info">
              <div class="contact-name">${conn.name}</div>
              <div class="contact-last-msg">Click to message</div>
            </div>
          `;
          item.onclick = () => openChat(conn.uid, conn.name, conn.photo);
          contactsList.appendChild(item);
        });

        // Auto-open chat if 'to' param exists
        const urlParams = new URLSearchParams(window.location.search);
        const targetUid = urlParams.get('to');
        if (targetUid) {
            const conn = connections.find(c => c.uid === targetUid);
            if (conn) openChat(conn.uid, conn.name, conn.photo);
        }
      });
    }

    function openChat(targetUid, targetName, targetPhoto) {
      if (messageListener) messageListener(); // Unsubscribe prev
      
      // Update UI
      document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`contact-${targetUid}`).classList.add('active');

      const chatWindow = document.getElementById('chatWindow');
      const chatId = [currentUserId, targetUid].sort().join('_');
      currentChatId = chatId;

      const init = targetName.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);

      chatWindow.innerHTML = `
        <div class="chat-header">
          <div class="contact-av" style="width:36px; height:36px; font-size:14px;">
            ${targetPhoto ? `<img src="${targetPhoto}">` : init}
          </div>
          <h3>${targetName}</h3>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="chat-input-area">
          <input type="text" class="chat-input" id="messageInput" placeholder="Type a message..." autocomplete="off">
          <button class="send-btn" id="sendBtn">➤</button>
        </div>
      `;

      const msgInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');

      sendBtn.onclick = () => sendMessage(targetUid);
      msgInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(targetUid); };

      // Listen for messages
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"), limit(100));
      messageListener = onSnapshot(q, (snapshot) => {
        const area = document.getElementById('messagesArea');
        area.innerHTML = '';
        snapshot.forEach(doc => {
          const msg = doc.data();
          const isSent = msg.senderId === currentUserId;
          const time = msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...';
          
          const wrapper = document.createElement('div');
          wrapper.className = `msg-wrapper ${isSent ? 'sent' : 'received'}`;
          wrapper.innerHTML = `
            <div class="message">${msg.text}</div>
            <div class="msg-time">${time}</div>
          `;
          area.appendChild(wrapper);
        });
        area.scrollTop = area.scrollHeight;
      });
    }

    async function sendMessage(targetUid) {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      input.value = '';
      
      try {
        await addDoc(collection(db, "chats", currentChatId, "messages"), {
          senderId: currentUserId,
          text: text,
          timestamp: serverTimestamp()
        });
        
        // Update last message in chat summary (optional but good)
        await setDoc(doc(db, "chats", currentChatId), {
            users: [currentUserId, targetUid],
            lastMessage: text,
            lastTimestamp: serverTimestamp()
        }, { merge: true });

      } catch (err) {
        console.error("Error sending message:", err);
      }
    }
  </script>
</body>
</html>
