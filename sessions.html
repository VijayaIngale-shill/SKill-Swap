<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Sessions – GyanSwap</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #00FF9C;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.14);
            --text: #fff;
            --text-muted: rgba(255, 255, 255, 0.55);
            --sidebar-w: 240px;
        }

        ::selection {
            background: var(--accent);
            color: #1a1a2e;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-w);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 28px 0;
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
        }
        .sidebar-logo { padding: 0 24px 28px; font-size: 20px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar-logo span { color: var(--accent); }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 24px;
            color: rgba(255,255,255,0.6); text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.2s;
        }
        .nav-item:hover { color: #fff; background: rgba(255,255,255,0.07); }
        .nav-item.active { color: #fff; background: rgba(255,255,255,0.12); font-weight: 600; position: relative; }
        .nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }

        .main { margin-left: var(--sidebar-w); flex: 1; padding: 40px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-schedule {
            background: var(--accent); color: #1a1a2e; border: none; padding: 10px 24px;
            border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-schedule:hover { transform: scale(1.05); }

        /* ── Grid ── */
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }

        .glass-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 20px; padding: 24px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        /* ── Session List ── */
        .session-item {
            background: rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 18px;
            margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
            transition: 0.2s; border: 1px solid transparent;
        }
        .session-item:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255,255,255,0.1); }
        .session-info h3 { font-size: 15px; margin-bottom: 4px; }
        .session-info p { font-size: 13px; color: var(--text-muted); }
        .session-status { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
        .status-active { background: rgba(0, 255, 156, 0.15); color: var(--accent); }
        .status-accepted { background: rgba(102, 126, 234, 0.15); color: #8a9fed; }
        .status-pending { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .status-paused { background: rgba(255, 165, 0, 0.15); color: #ffa500; }
        .status-completed { background: rgba(0, 255, 156, 0.1); color: rgba(0, 255, 156, 0.6); }
        .status-terminated { background: rgba(255, 99, 71, 0.15); color: #ff6347; }
        .btn-enter { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-enter:hover { background: var(--accent); color: #1a1a2e; border-color: var(--accent); }

        /* ── Modal ── */
        #scheduleModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content { width: 100%; max-width: 500px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
        .form-input {
            width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; padding: 12px 16px; color: #fff; font-family: 'Poppins', sans-serif; outline: none;
        }
        .form-input:focus { border-color: var(--accent); }

        select.form-input option {
            background-color: #1a1a2e;
            color: #fff;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">Gyan<span>Swap</span></div>
        <a href="Dashboard.html" class="nav-item">🏠 Dashboard</a>
        <a href="profile.html" class="nav-item">👤 My Profile</a>
        <a href="search.html" class="nav-item">🔍 Explore Skills</a>
        <a href="requests.html" class="nav-item">🤝 Requests</a>
        <a href="messages.html" class="nav-item">💬 Messages</a>
        <a href="sessions.html" class="nav-item active">📅 Sessions</a>
    </aside>

    <main class="main">
        <div class="header">
            <h2>Study Sessions</h2>
            <button class="btn-schedule" onclick="showModal()">+ Schedule New Session</button>
        </div>

        <div class="grid">
            <div class="glass-card">
                <div class="card-title">🔥 Active Sessions</div>
                <div id="activeSessions">
                    <div style="padding:20px; text-align:center; opacity:0.5;">Loading...</div>
                </div>

                <div class="card-title" style="margin-top: 30px;">📩 Pending Invitations</div>
                <div id="pendingSessions">
                    <div style="padding:20px; text-align:center; opacity:0.5;">Loading...</div>
                </div>

                <div class="card-title" style="margin-top: 30px;">📜 History</div>
                <div id="completedSessions">
                    <div style="padding:20px; text-align:center; opacity:0.5;">Loading...</div>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-title">Quick Stats</div>
                <div style="font-size:14px; line-height:1.8;">
                    <p>🔥 <strong>Persistence:</strong> <span id="statSuccess">--</span></p>
                    <p>🎓 <strong>Skills Taught:</strong> <span id="statTaught">--</span></p>
                    <p>📖 <strong>Skills Learned:</strong> <span id="statLearned">--</span></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Schedule Modal -->
    <div id="scheduleModal">
        <div class="glass-card modal-content">
            <div class="card-title">Schedule a Session</div>
            <form id="scheduleForm">
                <div class="form-group">
                    <label>Partner</label>
                    <select class="form-input" id="partnerSelect" required>
                        <option value="">Select a connection...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Skill to Study</label>
                    <input type="text" class="form-input" id="sessionSkill" placeholder="e.g. React.js, Spanish, UI Design" required>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="button" class="form-input" onclick="hideModal()">Cancel</button>
                    <button type="submit" class="btn-schedule" style="flex:1;">Send Invitation</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getFirestore, collection, query, where, onSnapshot, addDoc, 
            serverTimestamp, getDocs, doc, getDoc, updateDoc 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBq-BrrT0N4lszLMHowVkk12jit96t7sis",
            authDomain: "gyan-swap.firebaseapp.com",
            projectId: "gyan-swap",
            storageBucket: "gyan-swap.firebasestorage.app",
            messagingSenderId: "111231263033",
            appId: "1:111231263033:web:05d8e6166a06c57d57c8e8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = 'registration.html'; return; }
            currentUser = user;
            loadSessions();
            loadConnections();
            loadUserStats();
        });

        async function loadUserStats() {
            const userDoc = await getDoc(doc(db, "users", currentUser.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                document.getElementById('statTaught').textContent = data.skillsTaughtCount || 0;
                document.getElementById('statLearned').textContent = data.skillsLearnedCount || 0;
                document.getElementById('statSuccess').textContent = (data.reliabilityRating || 100) + '%';
            }
        }

        async function loadConnections() {
            const select = document.getElementById('partnerSelect');
            const addedUids = new Set();

            const addPartner = (uid, name) => {
                if (!uid || addedUids.has(uid)) return;
                addedUids.add(uid);
                const opt = document.createElement('option');
                opt.value = uid;
                opt.textContent = name || 'User';
                opt.dataset.name = name || 'User';
                select.appendChild(opt);
            };

            try {
                // Query 1: sessions where current user is the sender
                const q1 = query(
                    collection(db, "swap_requests"),
                    where("status", "==", "accepted"),
                    where("fromUid", "==", currentUser.uid)
                );
                // Query 2: sessions where current user is the receiver
                const q2 = query(
                    collection(db, "swap_requests"),
                    where("status", "==", "accepted"),
                    where("toUid", "==", currentUser.uid)
                );

                const [snap1, snap2] = await Promise.all([getDocs(q1), getDocs(q2)]);

                snap1.forEach(d => {
                    const data = d.data();
                    addPartner(data.toUid, data.toName);
                });
                snap2.forEach(d => {
                    const data = d.data();
                    addPartner(data.fromUid, data.fromName);
                });

                if (addedUids.size === 0) {
                    const empty = document.createElement('option');
                    empty.disabled = true;
                    empty.textContent = 'No connections yet — send a swap request first!';
                    select.appendChild(empty);
                }
            } catch (err) {
                console.error("Failed to load connections:", err);
                alert("Could not load your connections: " + err.message);
            }
        }

        function loadSessions() {
            const q = query(
                collection(db, "sessions"), 
                where("participants", "array-contains", currentUser.uid)
            );

            onSnapshot(q, (snapshot) => {
                const activeList = document.getElementById('activeSessions');
                const pendingList = document.getElementById('pendingSessions');
                const historyList = document.getElementById('completedSessions');
                
                activeList.innerHTML = '';
                pendingList.innerHTML = '';
                historyList.innerHTML = '';
                
                if (snapshot.empty) {
                    activeList.innerHTML = '<div style="padding:20px; text-align:center; opacity:0.5;">No active sessions.</div>';
                    pendingList.innerHTML = '<div style="padding:20px; text-align:center; opacity:0.5;">No pending invitations.</div>';
                    historyList.innerHTML = '<div style="padding:20px; text-align:center; opacity:0.5;">No past sessions.</div>';
                    return;
                }

                const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                // Sorting helper
                const sortByTime = (a, b) => {
                    const timeA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date();
                    const timeB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date();
                    return timeB - timeA;
                };

                const activeSessions = docs.filter(s => ['accepted', 'active', 'paused'].includes(s.status)).sort(sortByTime);
                const pendingSessions = docs.filter(s => s.status === 'pending').sort(sortByTime);
                const historySessions = docs.filter(s => ['completed', 'terminated'].includes(s.status)).sort(sortByTime);

                renderSessionCards(activeSessions, activeList, 'active');
                renderSessionCards(pendingSessions, pendingList, 'pending');
                renderSessionCards(historySessions, historyList, 'history');
            });
        }

        function renderSessionCards(sessions, container, type) {
            if (sessions.length === 0) {
                container.innerHTML = `<div style="padding:20px; text-align:center; opacity:0.5;">No ${type} sessions.</div>`;
                return;
            }

            sessions.forEach(sess => {
                const partnerUid = sess.participants.find(p => p !== currentUser.uid);
                const partnerName = sess.participantNames[partnerUid] || 'Partner';
                const time = sess.createdAt?.toDate ? sess.createdAt.toDate().toLocaleString() : 'Just now';
                
                const card = document.createElement('div');
                card.className = 'session-item';
                
                let actionBtn = '';
                if (sess.status === 'pending') {
                    if (sess.createdBy !== currentUser.uid) {
                        actionBtn = `<button class="btn-enter" onclick="handleInvitation('${sess.id}', 'accepted')">Accept</button>`;
                    } else {
                        actionBtn = '<span style="font-size:12px; opacity:0.6;">Waiting...</span>';
                    }
                } else if (['accepted', 'active', 'paused'].includes(sess.status)) {
                    actionBtn = `<button class="btn-enter" onclick="window.location.href='session-room.html?id=${sess.id}'">Enter Session</button>`;
                }

                card.innerHTML = `
                    <div class="session-info">
                        <h3>${sess.skillName}</h3>
                        <p>with ${partnerName} • ${time}</p>
                    </div>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <span class="session-status status-${sess.status}">${sess.status}</span>
                        ${actionBtn}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.showModal = () => document.getElementById('scheduleModal').style.display = 'flex';
        window.hideModal = () => document.getElementById('scheduleModal').style.display = 'none';

        document.getElementById('scheduleForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Checking...";

            const partnerSelect = document.getElementById('partnerSelect');
            const partnerUid = partnerSelect.value;
            const partnerName = partnerSelect.options[partnerSelect.selectedIndex].dataset.name;
            const skill = document.getElementById('sessionSkill').value;

            try {
                // Check for duplicate active sessions
                const activeQuery = query(
                    collection(db, "sessions"),
                    where("participants", "array-contains", currentUser.uid),
                    where("status", "in", ["pending", "accepted", "active", "paused"])
                );
                
                const activeSnapshot = await getDocs(activeQuery);
                const existingSession = activeSnapshot.docs.find(doc => doc.data().participants.includes(partnerUid));
                
                if (existingSession) {
                    alert("You already have an active or pending session with this user.");
                    btn.disabled = false;
                    btn.textContent = "Send Invitation";
                    return;
                }

                await addDoc(collection(db, "sessions"), {
                    participants: [currentUser.uid, partnerUid],
                    participantNames: { 
                        [currentUser.uid]: currentUser.displayName || 'Me', 
                        [partnerUid]: partnerName 
                    },
                    skillName: skill,
                    status: 'pending',
                    createdBy: currentUser.uid,
                    createdAt: serverTimestamp(),
                    lastActiveAt: serverTimestamp(),
                    deadlineToRejoin: null,
                    tasks: []
                });
                
                hideModal();
                alert("Session invitation sent!");
                document.getElementById('scheduleForm').reset();
            } catch (err) { 
                alert("Error: " + err.message); 
            } finally {
                btn.disabled = false;
                btn.textContent = "Send Invitation";
            }
        };

        window.handleInvitation = async (id, status) => {
            try {
                await updateDoc(doc(db, "sessions", id), {
                    status: status,
                    acceptedAt: serverTimestamp()
                });
                if (status === 'accepted') {
                    window.location.href = `session-room.html?id=${id}`;
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        };
    </script>
</body>
</html>
