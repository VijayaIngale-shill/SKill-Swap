<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Skills – GyanSwap</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --secondary: #4f46e5;
      --accent: #10b981; /* Emerald/Teal */
      --accent-glow: rgba(16, 185, 129, 0.5);
      --bg-dark: #0f172a;
      --bg-slate: #1e293b;
      --card-bg: rgba(30, 41, 59, 0.6);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    ::selection {
      background: var(--accent);
      color: #0f172a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #1e293b 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .back-btn {
      text-decoration: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      background: rgba(255,255,255,0.05);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.1);
      transform: translateX(-4px);
      box-shadow: 0 0 20px rgba(255,255,255,0.05);
    }

    .header-title-container {
      text-align: right;
    }

    h2 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }

    .search-row {
      margin-bottom: 50px;
      position: relative;
    }

    input {
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 18px 28px;
      color: #fff;
      font-size: 17px;
      outline: none;
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
      box-shadow: 0 0 25px var(--accent-glow);
    }
    
    input:focus {
      background: rgba(30, 41, 59, 0.9);
      box-shadow: 0 0 40px var(--accent-glow);
    }

    input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .section-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .user-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    .user-card:hover {
      transform: translateY(-8px);
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      background: rgba(30, 41, 59, 0.8);
    }

    .user-top {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar-lg {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; color: #fff; overflow: hidden;
      border: 2px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }

    .user-info h3 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .user-info p { font-size: 14px; color: var(--text-muted); line-height: 1.4; }

    .skill-header {
      font-size: 11px;
      color: var(--accent);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .skills-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill-tag {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 14px; border-radius: 14px; font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .send-req-btn {
      margin-top: auto;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .send-req-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 8px 20px var(--primary-glow);
    }

    .send-req-btn:disabled { 
      background: rgba(255,255,255,0.1); 
      color: var(--text-muted); 
      cursor: not-allowed; 
      border-color: var(--card-border);
      opacity: 0.8;
    }

    .status-badge {
      font-size: 11px;
      color: var(--accent);
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 10px;
      border-radius: 30px;
      border: 1px solid var(--accent-glow);
      font-weight: 700;
    }

    #loadingOverlay {
        position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7);
        display: none; align-items: center; justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(8px);
    }
    .loader {
        width: 50px; height: 50px; border: 4px solid var(--card-border); border-bottom-color: var(--accent);
        border-radius: 50%; display: inline-block;
        animation: rotation 1s linear infinite;
    }
    @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; gap: 15px; }
      .header-title-container { text-align: left; }
    }
  </style>
</head>
<body>

  <div id="loadingOverlay"><span class="loader"></span></div>

  <div class="container">
    <div class="header">
      <a href="Dashboard.html" class="back-btn">← Home</a>
      <div class="header-title-container">
        <h2>Explore Skills</h2>
      </div>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search for a skill (e.g. Python, Java, Graphic Design...)" autocomplete="off">
    </div>

    <div id="sectionLabel" class="section-label">Top Recommendations for you</div>
    <div class="results-grid" id="searchResults">
      <!-- Search results will appear here -->
      <div style="grid-column: 1/-1; text-align: center; opacity: 0.6; padding-top: 40px;">
        Start typing to find users with the skills you want to learn.
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBq-BrrT0N4lszLMHowVkk12jit96t7sis",
      authDomain: "gyan-swap.firebaseapp.com",
      projectId: "gyan-swap",
      storageBucket: "gyan-swap.firebasestorage.app",
      messagingSenderId: "111231263033",
      appId: "1:111231263033:web:05d8e6166a06c57d57c8e8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let debounceTimer;
    let outgoingRequests = {}; // Map of toUid -> status

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'registration.html'; return; }
      currentUser = user;
      await fetchOutgoingRequests();
      await loadInitialRecommendations();
    });

    async function fetchOutgoingRequests() {
      const q = query(collection(db, "swap_requests"), where("fromUid", "==", currentUser.uid));
      const snap = await getDocs(q);
      snap.forEach(doc => {
        outgoingRequests[doc.data().toUid] = doc.data().status;
      });
    }

    async function loadInitialRecommendations() {
      resultsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding-top: 40px;"><span class="loader"></span></div>';
      try {
        const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
        const userData = userDoc.exists() ? userDoc.data() : {};
        const skillsWanted = userData.skillsWanted || [];

        const qUsers = query(collection(db, "users"));
        const snapshot = await getDocs(qUsers);
        
        let pool = [];
        snapshot.forEach(d => {
          if (d.id !== currentUser.uid) pool.push({ id: d.id, ...d.data() });
        });

        // Simple Recommendation: Users teaching what I want
        let recommended = pool.filter(p => {
          const teaches = p.skillsKnown || [];
          return skillsWanted.some(w => teaches.some(t => t.toLowerCase().includes(w.toLowerCase())));
        });

        // If no direct matches, show popular/latest users
        if (recommended.length === 0) {
          recommended = pool.slice(0, 10);
        }

        resultsGrid.innerHTML = '';
        if (recommended.length === 0) {
          resultsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; opacity: 0.6; padding-top: 40px;">No recommendations found yet. Try search!</div>';
        } else {
          recommended.forEach(user => renderUserCard(user.id, user, ""));
        }
      } catch (err) {
        console.error("Recs error:", err);
      }
    }

    const searchInput = document.getElementById('searchInput');
    const resultsGrid = document.getElementById('searchResults');
    const loadingOverlay = document.getElementById('loadingOverlay');

    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const queryText = searchInput.value.trim();
      const sectionLabel = document.getElementById('sectionLabel');

      if (!queryText) {
        sectionLabel.textContent = "Top Recommendations for you";
        loadInitialRecommendations();
        return;
      }
      
      sectionLabel.textContent = `Search results for "${queryText}"`;
      debounceTimer = setTimeout(() => performSearch(queryText), 400);
    });

    async function performSearch(skillName) {
      resultsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding-top: 40px;"><span class="loader"></span></div>';
      
      try {
        const q = query(collection(db, "users"));
        const snapshot = await getDocs(q);
        
        let count = 0;
        resultsGrid.innerHTML = '';

        snapshot.forEach((doc) => {
          const data = doc.data();
          if (doc.id === currentUser.uid) return;

          const skills = data.skillsKnown || [];
          const matches = skills.some(s => s.toLowerCase().includes(skillName.toLowerCase()));

          if (matches) {
            count++;
            renderUserCard(doc.id, data, skillName);
          }
        });

        if (count === 0) {
          resultsGrid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding-top: 60px;">
              <p style="font-size: 18px; color: var(--text-muted);">No users found with that skill. Try another one!</p>
            </div>
          `;
        }
      } catch (err) {
        console.error("Search error:", err);
      }
    }

    function renderUserCard(uid, data, searchedSkill) {
      const card = document.createElement('div');
      card.className = 'user-card';
      
      const initials = (data.displayName || "User").split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const photo = data.photoURL;
      const status = outgoingRequests[uid];
      
      let buttonHtml = `<button class="send-req-btn" onclick="sendSwapRequest('${uid}', '${data.displayName}', '${searchedSkill || (data.skillsKnown ? data.skillsKnown[0] : 'Skill')}')">Send Swap Request</button>`;
      
      if (status === 'pending') {
        buttonHtml = `<button class="send-req-btn" disabled>Request Sent</button>`;
      } else if (status === 'accepted') {
        buttonHtml = `<button class="send-req-btn" disabled>Connected</button>`;
      }

      card.innerHTML = `
        <div class="user-top">
          <div class="avatar-lg">
            ${photo ? `<img src="${photo}">` : initials}
          </div>
          <div class="user-info">
            <h3>${data.displayName || "User"}</h3>
            <p>${data.bio || "Hard work is the key"}</p>
          </div>
        </div>
        <div>
          <div class="skill-header">Can Teach</div>
          <div class="skills-list">
            ${(data.skillsKnown || []).map(s => `<span class="skill-tag">${s}</span>`).join('')}
          </div>
        </div>
        ${buttonHtml}
      `;
      resultsGrid.appendChild(card);
    }

    window.sendSwapRequest = async (toUid, toName, skill) => {
      if (!confirm(`Send a swap request to ${toName} for "${skill}"?`)) return;

      loadingOverlay.style.display = 'flex';
      try {
        await addDoc(collection(db, "swap_requests"), {
          fromUid: currentUser.uid,
          fromName: currentUser.displayName || currentUser.email.split('@')[0],
          fromPhoto: currentUser.photoURL || "",
          toUid: toUid,
          toName: toName,
          status: 'pending',
          skill: skill,
          timestamp: serverTimestamp()
        });
        outgoingRequests[toUid] = 'pending'; // Update local state
        alert("Request sent successfully! They will see it on their dashboard.");
        performSearch(searchInput.value.trim()); // Refresh to update UI
      } catch (err) {
        console.error("Request error:", err);
        alert("Failed to send request: " + err.message);
      } finally {
        loadingOverlay.style.display = 'none';
      }
    };
  </script>
</body>
</html>
